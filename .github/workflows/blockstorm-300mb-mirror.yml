name: Publish Blockstorm 300MB mirror

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/blockstorm-300mb-mirror.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch compiled APK
        run: |
          curl -L --fail --retry 5             "https://d2ol7oe51mr4n9.cloudfront.net/user_3JZXBV3kdN17gsGylg0Ha4PMZ0i/fcf997c0-ad66-4bff-94e1-3c864d349792.zip"             -o transfer.zip
          unzip -o transfer.zip
          test -f Blockstorm_Royale_S1_HD_300MB.apk
          BYTES=$(stat -c%s Blockstorm_Royale_S1_HD_300MB.apk)
          echo "APK bytes: $BYTES"
          test "$BYTES" -gt 300000000
          echo "d61262a35a865881ac3045aed896f34fddf39f7ee6186eecf0ccdcc6e04ff44f  Blockstorm_Royale_S1_HD_300MB.apk" | sha256sum -c -
      - name: Publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="blockstorm-s1-hd-300mb-v1.0.1"
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG"             Blockstorm_Royale_S1_HD_300MB.apk             --title "Blockstorm Royale S1 HD 300MB v1.0.1"             --notes "Public mirror. Signed Android APK. Physical file size over 300 MB."
